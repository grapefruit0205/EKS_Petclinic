worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $request_id "$request" $status '
                  '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                  'up=$upstream_addr';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  upstream app_upstream {
    server app-svc.petclinic-dev.svc.cluster.local:8080;
    keepalive 32;
  }

  # ── 업무 listener 8080 ────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;

    # 설계안 6.3: Web 8080 에서 /health/* 를 차단해 App 의 같은 경로를 외부로 프록시하지 않는다.
    location /health/ {
      return 404;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # 외부 호스트 보존 + 신뢰 경계에서 헤더 정규화
      # (임의 사용자 Forwarded 헤더는 제거하고 canonical scheme 을 주입한다)
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port  443;
      proxy_set_header Forwarded         "";
      proxy_set_header X-Request-Id      $request_id;

      proxy_connect_timeout 5s;
      proxy_send_timeout    25s;
      proxy_read_timeout    25s;

      proxy_pass http://app_upstream;
    }
  }

  # ── 관리 listener 8081 (ALB target 아님, kubelet probe 전용) ──────────────
  server {
    listen 8081;
    server_name _;

    location = /health/live {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /health/ready {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}

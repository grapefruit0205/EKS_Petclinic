###############################################################################
# internet-facing ALB + AWS WAF (설계안 Phase 6·7)
#   - ALB 가 유일한 외부 진입점이고, 그 앞단에 Regional WAF WebACL 이 붙는다.
#   - target-type: ip → 실제 데이터는 Web Pod IP 로 전달된다.
#   - ALB 는 AWS Load Balancer Controller 소유, WebACL 은 Terraform 소유.
#     연결은 아래 wafv2-acl-arn annotation 으로 LBC 가 수행한다.
#
#   채워야 할 값:
#     <PUBLIC_SUBNET_ID_A>,<PUBLIC_SUBNET_ID_B>  terraform output public_subnet_ids
#     <ALB_SECURITY_GROUP_ID>                    terraform output alb_sg_id
#     <ACM_CERTIFICATE_ARN>                      terraform output acm_certificate_arn
#     <WAF_WEB_ACL_ARN>                          terraform output waf_web_acl_arn
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic-web
  namespace: petclinic-dev
  annotations:
    # ── 진입 방식 ────────────────────────────────────────────────────────────
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: <PUBLIC_SUBNET_ID_A>,<PUBLIC_SUBNET_ID_B>
    alb.ingress.kubernetes.io/security-groups: <ALB_SECURITY_GROUP_ID>

    # ── TLS: HTTPS 443 + HTTP 80 → 443 리다이렉트 ────────────────────────────
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn: <ACM_CERTIFICATE_ARN>
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ── AWS WAF 연결 (LBC 가 association 수행) ───────────────────────────────
    alb.ingress.kubernetes.io/wafv2-acl-arn: <WAF_WEB_ACL_ARN>

    # ── 백엔드/헬스 ──────────────────────────────────────────────────────────
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"

    alb.ingress.kubernetes.io/group.name: petclinic
    alb.ingress.kubernetes.io/tags: Project=petclinic-3tier,Environment=dev,Owner=kdt5,ManagedBy=aws-load-balancer-controller
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 8080

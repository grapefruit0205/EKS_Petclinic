###############################################################################
# Tier 2 — Spring MVC / Tomcat App
#   - DB 설정은 외부 파일(/etc/petclinic/data-access.properties)로만 주입한다.
#     (Secret app-config → volume mount, readOnly)
#   - startup schema/data 초기화는 noop 으로 차단하고 migration 으로만 스키마를 만든다.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petclinic-app
  namespace: petclinic-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/petclinic-dev-app-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/component: app
    tier: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: petclinic
        app.kubernetes.io/component: app
        tier: app
    spec:
      serviceAccountName: petclinic-app
      nodeSelector:
        tier: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: petclinic
              app.kubernetes.io/component: app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: petclinic
              app.kubernetes.io/component: app
      containers:
        - name: app
          image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-app:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JVM_OPTS
              value: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: app-config
              mountPath: /etc/petclinic
              readOnly: true
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
      volumes:
        - name: app-config
          secret:
            secretName: app-config
            defaultMode: 0440
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-pdb
  namespace: petclinic-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic
      app.kubernetes.io/component: app
